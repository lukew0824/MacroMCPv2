[project]
name = "macromcp-server"
version = "0.1.0"
description = "MCP server exposing MacroMCP's intake/commit/query tools over Postgres"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
