<text x="53" y="203" class="tname" style="fill:#7C3A06">in-context draft</text>
<text x="53" y="227" class="tsub" fill="#7C3A06">lives in the LLM context window &#8212; NOT stored</text>
<text x="53" y="247" class="fld" style="fill:#3F3F3A" font-weight="400">raw_utterance</text>
<text x="53" y="264" class="fld" style="fill:#3F3F3A" font-weight="400">eaten_at</text>
<text x="53" y="281" class="fld" style="fill:#9A3412" font-weight="400">meal { meal_id … }</text>
<text x="319" y="281" class="note" text-anchor="end" style="fill:#9A3412">non-null = ATTACH</text>
<text x="53" y="298" class="fld" style="fill:#3F3F3A" font-weight="400">     { name, meal_type_key }</text>
<text x="53" y="315" class="fld" style="fill:#1C1C1A" font-weight="700">items[]</text>
<text x="53" y="332" class="fld" style="fill:#0F766E" font-weight="400">  name</text>
<text x="319" y="332" class="note" text-anchor="end" style="fill:#0F766E">decision</text>
<text x="53" y="349" class="fld" style="fill:#3730A3" font-weight="400">  raw_text + span</text>
<text x="319" y="349" class="note" text-anchor="end" style="fill:#3730A3">anchor</text>
<text x="53" y="366" class="fld" style="fill:#0F766E" font-weight="400">  portion_fraction {num,den}</text>
<text x="319" y="366" class="note" text-anchor="end" style="fill:#0F766E">decision</text>
<text x="53" y="383" class="fld" style="fill:#1C1C1A" font-weight="700">  ingredients[]</text>
<text x="53" y="400" class="fld" style="fill:#0F766E" font-weight="400">    food_name</text>
<text x="319" y="400" class="note" text-anchor="end" style="fill:#0F766E">decision</text>
<text x="53" y="417" class="fld" style="fill:#0F766E" font-weight="400">    grams</text>
<text x="319" y="417" class="note" text-anchor="end" style="fill:#0F766E">decision</text>
<text x="53" y="434" class="fld" style="fill:#0F766E" font-weight="400">    kcal_per_100g</text>
<text x="319" y="434" class="note" text-anchor="end" style="fill:#0F766E">PER 100g, never absolute</text>
<text x="53" y="451" class="fld" style="fill:#0F766E" font-weight="400">    protein / carbs / fat</text>
<text x="319" y="451" class="note" text-anchor="end" style="fill:#0F766E">PER 100g, never absolute</text>
<text x="53" y="468" class="fld" style="fill:#8A8A82" font-weight="400">    quantity + unit_label</text>
<text x="319" y="468" class="note" text-anchor="end" style="fill:#8A8A82">what the user said</text>
<text x="53" y="485" class="fld" style="fill:#B91C1C" font-weight="700">  server does every sum</text>
<text x="319" y="485" class="note" text-anchor="end" style="fill:#B91C1C">no model arithmetic</text>
<text x="53" y="502" class="fld" style="fill:#3F3F3A" font-weight="400">gaps[] {kind, item_ordinal}</text>
<text x="53" y="519" class="fld" style="fill:#3F3F3A" font-weight="400">unconsumed_spans[]</text>
